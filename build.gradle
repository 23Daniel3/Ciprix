plugins {
    id 'java-library'
    id 'maven-publish'
    id 'edu.wpi.first.GradleRIO' version '2026.1.1'  
}

group = 'dev.daniel'
version = '2026.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven { url 'https://frcmaven.wpi.edu/artifactory/release/' }                    // WPILib
    maven { url 'https://frcmaven.wpi.edu/artifactory/littletonrobotics-mvn-release/' } // AdvantageKit
    maven { url 'https://maven.pathplanner.dev/releases' }                            // PathplannerLib
}

task(replayWatch, type: JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
}

dependencies {
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()
    
    implementation 'org.apache.commons:commons-math3:3.+'

    def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Ciprix'
                description = 'Library for the Ciprix framework'
            }
        }
    }
    repositories {
        maven {
            url = uri("$buildDir/repos/releases")
        }
    }
}