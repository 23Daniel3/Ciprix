# Publishes Ciprix as a vendordep: the Maven repository goes to gh-pages/repo and the
# Ciprix*.json files to the root of gh-pages, served at https://23daniel3.github.io/Ciprix/.
# Runs when a release is published (tag v<ciprixVersion>) or manually with a tag.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (for example v2026.2.0)'
        required: true

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish to gh-pages
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check version
        run: |
          VERSION=$(grep '^ciprixVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "ciprixVersion=$VERSION, tag=$TAG"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match ciprixVersion=$VERSION in gradle.properties."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build, tests and local publish
        run: |
          chmod +x gradlew
          ./gradlew build publish generateVendordeps --max-workers 2

      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update gh-pages
        run: |
          mkdir -p gh-pages/repo
          # The Maven repository accumulates versions: older ones stay available.
          cp -r build/repos/releases/. gh-pages/repo/
          # The root always has the latest version (it's what VS Code downloads via jsonUrl).
          cp build/vendordeps/*.json gh-pages/
          # Versioned copy, for anyone who wants to pin a version.
          mkdir -p "gh-pages/vendordeps/$VERSION"
          cp build/vendordeps/*.json "gh-pages/vendordeps/$VERSION/"
          touch gh-pages/.nojekyll
          {
            echo "<!doctype html><meta charset=utf-8><title>Ciprix</title>"
            echo "<h1>Ciprix $VERSION</h1>"
            echo "<p>Install from the WPILib VS Code extension: Manage Vendor Libraries &rarr; Install new library (online).</p><ul>"
            for f in build/vendordeps/*.json; do
              n=$(basename "$f")
              echo "<li><a href=\"$n\">https://23daniel3.github.io/Ciprix/$n</a></li>"
            done
            echo "</ul><p>Maven repository: <code>https://23daniel3.github.io/Ciprix/repo</code></p>"
            echo "<p><a href=\"docs/\">Docs</a></p>"
          } > gh-pages/index.html

      - name: Commit and push
        working-directory: gh-pages
        run: |
          git config user.name "Daniel Cipriani"
          git config user.email "143459572+23Daniel3@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed on gh-pages."
            exit 0
          fi
          git commit -m "Publish Ciprix $VERSION"
          git push origin gh-pages
