# Ciprix CI: the library and the template are independent Gradle builds (just like what a team
# opens in VS Code). The template consumes the library through its source (composite build).
# No roboRIO needed: the GradleRIO desktop build + simulated HAL cover the tests.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ciprix (library)
            dir: .
          - name: Template skeleton
            dir: templates/skeleton
          - name: Example arm-elevator
            dir: examples/arm-elevator
          - name: Example rev-and-phoenix5
            dir: examples/rev-and-phoenix5
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Wrapper permission
        run: chmod +x gradlew

      # Runs before the build on purpose: the build applies Spotless on its own, so checking
      # after it would never fail.
      - name: Spotless (formatting)
        run: ./gradlew spotlessCheck

      # 'build' compiles main + test and runs the JUnit tests.
      - name: Build + tests
        run: ./gradlew build --max-workers 2

      # Makes sure publishing and the vendordeps keep working on every PR.
      - name: Local publish (dry run)
        if: matrix.dir == '.'
        run: ./gradlew publish generateVendordeps

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ strategy.job-index }}
          path: |
            ${{ matrix.dir }}/**/build/reports/tests/
            ${{ matrix.dir }}/**/build/test-results/
          if-no-files-found: ignore
